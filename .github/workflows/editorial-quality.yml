name: Editorial Quality

on:
  pull_request:
    paths:
      - ".github/workflows/editorial-quality.yml"
      - "src/content/blog/**"
      - "src/repositories/blog.ts"
      - "src/lib/tool-editorial-*.ts"
      - "src/app/**/blog/**"
      - "src/app/**/tools/**"
      - "scripts/verify-editorial-quality.mts"
      - "package.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/editorial-quality.yml"
      - "src/content/blog/**"
      - "src/repositories/blog.ts"
      - "src/lib/tool-editorial-*.ts"
      - "src/app/**/blog/**"
      - "src/app/**/tools/**"
      - "scripts/verify-editorial-quality.mts"
      - "package.json"

permissions:
  contents: read

jobs:
  editorial-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify reviewed editorial content
        run: npm run verify:editorial
