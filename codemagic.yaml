workflows:
  mac-vnc-workspace:
    name: Web Empire - macOS Workspace
    instance_type: mac_mini_m2
    max_build_duration: 60
    working_directory: apps/mobile

    environment:
      node: 22
      xcode: latest
      cocoapods: default
      vars:
        EXPO_NO_TELEMETRY: "1"

    cache:
      cache_paths:
        - $HOME/.npm
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/apps/mobile/node_modules

    scripts:
      - name: Install mobile dependencies
        script: |
          npm ci

      - name: Generate native iOS project
        script: |
          npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        script: |
          cd ios
          pod install

      - name: Keep macOS workspace available for VNC
        script: |
          echo "The macOS workspace is ready for VNC access."
          echo "Cancel the build manually when finished to preserve free minutes."
          sleep 3000

    artifacts:
      - ios/**/*.xcworkspace
      - ios/**/*.xcodeproj
      - /tmp/xcodebuild_logs/*.log
